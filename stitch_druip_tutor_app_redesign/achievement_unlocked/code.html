<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(108, 159, 255, 0.4);
        }
        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: var(--color-primary);
            opacity: 0.7;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Achievement Shell -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center p-6 bg-gradient-to-br from-surface to-surface-container-low">
<!-- Decorative Background Elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<!-- Confetti Simulation (Static representations for CSS-only requirement) -->
<div class="absolute top-[10%] left-[15%] w-4 h-4 bg-secondary rounded-full rotate-45 opacity-60"></div>
<div class="absolute top-[20%] right-[20%] w-3 h-8 bg-primary-container rounded-full -rotate-12 opacity-60"></div>
<div class="absolute bottom-[30%] left-[10%] w-6 h-6 bg-tertiary-container rounded-lg rotate-12 opacity-60"></div>
<div class="absolute bottom-[15%] right-[15%] w-5 h-5 bg-secondary-container rounded-full opacity-60"></div>
<div class="absolute top-[40%] right-[5%] w-8 h-2 bg-primary rounded-full rotate-90 opacity-60"></div>
<!-- Large Editorial Text Bleed -->
<h2 class="absolute -bottom-10 -left-10 font-headline text-[15rem] font-extrabold text-surface-container opacity-50 select-none uppercase tracking-tighter">
                WIN
            </h2>
<h2 class="absolute -top-20 -right-10 font-headline text-[12rem] font-extrabold text-surface-container opacity-50 select-none uppercase tracking-tighter">
                ACE
            </h2>
</div>
<!-- Content Canvas -->
<div class="relative z-10 w-full max-w-xl text-center flex flex-col items-center">
<!-- Badge Section -->
<div class="relative mb-12">
<!-- Outer Glow/Halo -->
<div class="absolute inset-0 bg-primary-container blur-[100px] opacity-20 rounded-full scale-150"></div>
<!-- Main Badge Card -->
<div class="relative w-64 h-64 md:w-80 md:h-80 bg-surface-container-lowest rounded-xl shadow-[0_40px_80px_rgba(0,0,0,0.12)] flex items-center justify-center border-[8px] border-surface p-4">
<div class="w-full h-full bg-gradient-to-tr from-primary to-primary-container rounded-[2.5rem] flex flex-col items-center justify-center text-on-primary overflow-hidden">
<span class="material-symbols-outlined text-8xl md:text-9xl scale-125 mb-4" style="font-variation-settings: 'FILL' 1;">
                            workspace_premium
                        </span>
</div>
<!-- XP Tag Floating -->
<div class="absolute -bottom-6 -right-6 bg-secondary-container text-on-secondary-container font-headline font-extrabold text-2xl md:text-3xl px-8 py-4 rounded-xl shadow-lg transform rotate-6 border-4 border-surface">
                        +500 XP
                    </div>
</div>
</div>
<!-- Typography Header -->
<div class="space-y-4 mb-10">
<span class="inline-block bg-tertiary-container text-on-tertiary-container font-label text-xs tracking-[0.2em] px-4 py-1.5 rounded-full font-black uppercase">
                    Level Up Accomplished
                </span>
<h1 class="font-headline text-5xl md:text-7xl font-extrabold tracking-tight text-on-surface leading-tight">
                    Academic <span class="text-primary italic">Catalyst</span>
</h1>
<p class="text-on-surface-variant text-lg md:text-xl max-w-sm mx-auto leading-relaxed">
                    You've completed 10 study sessions without a single break. Your focus is unmatched.
                </p>
</div>
<!-- Stats/Bento Fragment -->
<div class="grid grid-cols-2 gap-4 w-full mb-12">
<div class="bg-surface-container-low p-6 rounded-lg text-left border-l-4 border-primary">
<p class="font-label text-[10px] text-slate-500 uppercase tracking-widest mb-1">Current Streak</p>
<p class="font-headline text-3xl font-bold text-on-surface">12 Days</p>
</div>
<div class="bg-surface-container-low p-6 rounded-lg text-left border-l-4 border-secondary">
<p class="font-label text-[10px] text-slate-500 uppercase tracking-widest mb-1">Global Rank</p>
<p class="font-headline text-3xl font-bold text-on-surface">Top 5%</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-4 w-full px-4">
<button class="flex-1 bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold py-5 px-8 rounded-full shadow-xl hover:shadow-2xl transition-all active:scale-95 flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="share">share</span>
                    Share Achievement
                </button>
<button class="flex-1 bg-surface-container-high text-on-surface font-headline font-bold py-5 px-8 rounded-full hover:bg-surface-dim transition-all active:scale-95">
                    Continue Journey
                </button>
</div>
</div>
</main>
<!-- Navigation Shell (Suppressed for focused celebration intent per Filter Rule, 
         but technically a "success" transactional screen so we prioritize content) -->
<!-- Floating Action Visual Element (Decorative only) -->
<div class="fixed bottom-10 right-10 w-24 h-24 bg-secondary-fixed opacity-10 blur-3xl pointer-events-none"></div>
<div class="fixed top-10 left-10 w-32 h-32 bg-primary-fixed opacity-10 blur-3xl pointer-events-none"></div>
<!-- Image for Context (Decorative Backdrop) -->
<div class="fixed inset-0 z-[-1]">
<img alt="University Vibe" class="w-full h-full object-cover opacity-[0.03] mix-blend-multiply" data-alt="Modern university campus architecture with geometric patterns and sun flare, clean academic aesthetic, soft focus" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHWSwB1efqVuxgsusEBtdXc5A7FktvLTPfghRIbAH5O6v5tNfoLm5qsd0FujfAplHvFF0_2hjeCCrZp99C0wKRh4R37BlFvztDYaMImY0OW-th7gjTvEsjA0znRR2nEtSz4SWW-ncJSz5pczaUsiWw2qmTbJKIR31u8eJOhkn_Myn5r8riiJD0CA2NotwY9pDCf2kTjsHN22yqSkRpRV_Pa_o33oy3muXt3imUfVr4sGWgKk0vGSwka6MBx0qdC8vFOtaeKtY1LfbG"/>
</div>
</body></html>
